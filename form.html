<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario HTML</title>

    <meta name="author" content="Nambert Alejandro Silva Eleuterio" />
    <meta
      name="description"
      content="A form to accomplish the w05 activity, in this form you can qualify and give a feedback about the product that you chose"
    />

    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/style-large.css" />

    <script src="script/form.js" defer></script>
    <script src="script/footer.js" defer></script>
  </head>

  <body>
    <header>
      <h1>Product Review</h1>
    </header>

    <main>
      <form method="get" action="review.html">
        <!-- PRODUCT NAME -->
        <h3>Product Name</h3>
        <label for="choose-product">Select a product</label><br />
        <select name="choose-product" id="choose-product" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>

        <!-- OVERALL RATING -->
        <h3>Overall Rating</h3>

        <input type="radio" id="star1" name="rating" value="1" required />
        <label for="star1">☆</label>

        <input type="radio" id="star2" name="rating" value="2" required />
        <label for="star2">☆☆</label>

        <input type="radio" id="star3" name="rating" value="3" required />
        <label for="star3">☆☆☆</label>

        <input type="radio" id="star4" name="rating" value="4" required />
        <label for="star4">☆☆☆☆</label>

        <input type="radio" id="star5" name="rating" value="5" required />
        <label for="star5">☆☆☆☆☆</label>

        <!-- DATE -->
        <h3>Date of Installation</h3>
        <label for="installation-date">Installation date</label><br />
        <input
          type="date"
          id="installation-date"
          name="installation-date"
          required
        />

        <!-- FEATURES -->
        <h3>
          Which features did you find useful?<br />
          <i>(Check all that apply)</i>
        </h3>

        <input
          type="checkbox"
          name="features"
          value="durability"
          id="durability"
        />
        <label for="durability">Durability</label><br />

        <input
          type="checkbox"
          name="features"
          value="ease-to-use"
          id="ease-to-use"
        />
        <label for="ease-to-use">Ease to Use</label><br />

        <input
          type="checkbox"
          name="features"
          value="performance"
          id="performance"
        />
        <label for="performance">Performance</label><br />

        <input type="checkbox" name="features" value="design" id="design" />
        <label for="design">Design</label><br />

        <!-- WRITTEN REVIEW -->
        <h3>Written Review</h3>
        <label for="review">Write your review</label><br />
        <textarea
          name="review"
          id="review"
          rows="5"
          cols="50"
          placeholder="Optional"
        ></textarea>

        <!-- NAME -->
        <h3>Your Name</h3>
        <label for="name">Your name</label><br />
        <input type="text" id="name" name="name" placeholder="Optional" />

        <!-- SUBMIT -->
        <br />
        <button type="submit">Enviar</button>
      </form>
    </main>

    <footer>
      <p>© 2025 - Nambert A. S. Eleuterio</p>
      <p>Brazil</p>
      <p>Last Modification: <span id="lastModifiedDate"></span></p>
    </footer>
  </body>
</html>
