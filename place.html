<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Country Place</title>
    <meta name="author" content="Nambert Alejandro Silva Eleuterio" />
    <meta
      name="description"
      content="The page will show a place that I would like to visit, this place is Portofino in Italy. There is a beatiful beatch there and a beatiful harbor."
    />
    <link rel="stylesheet" href="styles/place-large.css" />
    <link rel="stylesheet" href="styles/place.css" />
    <script src="scripts/place.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Italy</h1>
    </header>
    <main>
      <picture>
        <source srcset="images/roma-small.webp" media="(max-width: 550px)" />
        <source srcset="images/roma-large.webp" media="(min-width: 1000px)" />
        <source srcset="images/weather.svg" media="(min-width: 1000px)" />
        <source srcset="images/weather.svg" media="(max-width: 550px)" />
        <img src="images/roma-large.webp" alt="Roma capital of Italy" />
      </picture>
      <div class="card1">
        <div class="card-data">
          <h2>Data</h2>
        </div>
        <div class="card-content">
          <label id="area"><strong>Area:</strong> 301,340 sq km <br /></label>
          <label id="population"
            ><strong>Population:</strong> 59,554,023 <br
          /></label>
          <label id="capital"><strong>Capital:</strong> Rome <br /></label>
          <label id="language"
            ><strong>Language:</strong> Italian(oficial) <br
          /></label>
          <label id="currency"><strong>Currency:</strong> Euro <br /></label>
          <label id="time_zone"
            ><strong>Time Zone:</strong> UTC+1 (CET)
            <br />
          </label>
          <label id="calling_code"
            ><strong>Calling Code:</strong> +39 <br
          /></label>
          <label id="internet_tld"
            ><strong>Internet TLD:</strong> it <br
          /></label>
        </div>
      </div>
      <div class="weather">
        <img src="images/weather.svg" alt="Weather Image" />
        <div class="text-weather">
          <h2 class="footer-h2">Weather</h2>
          <p><strong>Temperature:</strong> <span id="temperature"></span></p>
          <p>
            <strong>Conditions:</strong> Partly Cloudy<span
              id="conditions"
            ></span>
          </p>
          <p><strong>Wind:</strong> <span id="wind"></span></p>
          <p><strong>Wind Chill:</strong><span id="wind_chill"></span></p>
        </div>
      </div>
    </main>
    <footer>
      <p class="names">
        &copy; <span id="currentyear"></span>2025 |
        <span class="name-fire">Nambert Alejandro Silva Eleuterio</span> <br />
        <span class="name-country">Italy</span>
      </p>
      <p class="dates">Last Modification: <span id="lastModified"></span></p>
    </footer>
  </body>
</html>
